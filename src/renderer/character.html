<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; }
  #buddy { width: 140px; height: 140px; cursor: pointer; display: block; }
  #buddy .body { animation: bob 3s ease-in-out infinite; transform-origin: 70px 120px; }
  @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
  .thinking .body { animation: think 0.8s ease-in-out infinite; }
  @keyframes think { 0%,100% { transform: rotate(-4deg) } 50% { transform: rotate(4deg) } }
  .happy .body { animation: hop 0.5s ease-in-out 3; }
  @keyframes hop { 50% { transform: translateY(-14px) } }
  .eye { transition: transform .15s; transform-origin: center; transform-box: fill-box; }
  .blink .eye { transform: scaleY(0.1); }
  .dots { opacity: 0; }
  .thinking .dots { opacity: 1; }
  .error .cheek { fill: #8aa2c8; }
</style>
</head>
<body>
<svg id="buddy" viewBox="0 0 140 140" aria-label="비서 캐릭터">
  <ellipse cx="70" cy="128" rx="36" ry="6" fill="rgba(0,0,0,.18)"/>
  <g class="body">
    <path d="M70 18 C108 18 122 50 122 80 C122 110 100 124 70 124 C40 124 18 110 18 80 C18 50 32 18 70 18Z" fill="#ffd36e" stroke="#e0a93a" stroke-width="3"/>
    <path d="M70 18 C66 8 74 4 80 8" fill="none" stroke="#e0a93a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="82" cy="8" r="4" fill="#ff8a65"/>
    <ellipse class="eye" cx="52" cy="72" rx="6" ry="9" fill="#3b2f2f"/>
    <ellipse class="eye" cx="88" cy="72" rx="6" ry="9" fill="#3b2f2f"/>
    <ellipse class="cheek" cx="40" cy="90" rx="8" ry="5" fill="#ff9e80" opacity=".7"/>
    <ellipse class="cheek" cx="100" cy="90" rx="8" ry="5" fill="#ff9e80" opacity=".7"/>
    <path d="M60 94 Q70 102 80 94" fill="none" stroke="#3b2f2f" stroke-width="3" stroke-linecap="round"/>
    <g class="dots" fill="#fff" stroke="#e0a93a" stroke-width="2">
      <circle cx="112" cy="30" r="5"/><circle cx="124" cy="18" r="7"/>
    </g>
  </g>
</svg>
<script src="character.js"></script>
</body>
</html>
